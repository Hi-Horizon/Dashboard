[package]
name = "hi-horizon-telemetry-dashboard"
version = "0.1.0"
description = "Dashboard for monitoring telemetry data from a solarboat"
authors = ["you"]
license = ""
repository = "https://github.com/Hi-Horizon/Dashboard"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
dotenvy = "0.15.7"
tauri-build = { version = "2.0.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.0.6", features = [] }
tauri-plugin-log = "2.0.0-rc"
tauri-plugin-shell = "2.3.1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
rumqttc = "0.25.1"
dotenvy = "0.15.7"

[target.'cfg(windows)'.dependencies]
peak-can = "0.2.0"

