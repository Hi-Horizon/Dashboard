<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="map"></div>

<script>
    var map = L.map('map').setView([53.0, 5.8], 13);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    class RouteManager {
        constructor(map) {
            this.map = map;
            this.waypoints = [];
            this.markers = [];
            this.polyline = L.polyline([], { color: 'blue' }).addTo(map);
            this.nextId = 1;
        }

        addWaypoint(latlng) {
            const wp = {
                id: this.nextId++,
                lat: latlng.lat,
                lng: latlng.lng
            };

            this.waypoints.push(wp);

            const marker = L.marker(latlng, { draggable: true })
                .addTo(this.map)
                .on('drag', e => this.updateWaypoint(wp.id, e.target.getLatLng()));
                marker.bindTooltip(
  () => {
    const index = this.waypoints.findIndex(w => w.id === wp.id);
    return `#${index + 1}`;
  },
  { permanent: false, direction: 'top' }
);


            this.markers.push(marker);
            this.updatePolyline();
            this.renderList();
            this.updateDistanceDisplay();

        }

        updateWaypoint(id, latlng) {
            const wp = this.waypoints.find(w => w.id === id);
            if (!wp) return;

            wp.lat = latlng.lat;
            wp.lng = latlng.lng;
            this.updatePolyline();
            this.updateDistanceDisplay();

        }

        updatePolyline() {
            const coords = this.waypoints.map(w => [w.lat, w.lng]);
            this.polyline.setLatLngs(coords);
        }

        toCartesian(lat, lng, refLat, refLng) {
            const R = 6371000;
            const φ = lat * Math.PI / 180;
            const λ = lng * Math.PI / 180;
            const φ0 = refLat * Math.PI / 180;
            const λ0 = refLng * Math.PI / 180;

            const x = R * (λ - λ0) * Math.cos(φ0);
            const y = R * (φ - φ0);

            return { x, y };
        }

exportCSV() {
  if (this.waypoints.length === 0) return;

  const ref = this.waypoints[0];

  let csv = "lat,lng,x_m,y_m\n";

  this.waypoints.forEach(wp => {
    const cart = this.toCartesian(
      wp.lat,
      wp.lng,
      ref.lat,
      ref.lng
    );


    csv += `${wp.lat},${wp.lng},${cart.x},${cart.y}\n`;
  });

  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  a.download = "route.csv";
  a.click();

  URL.revokeObjectURL(url);
}


        renderList() {
            const list = document.getElementById('waypoint-list');
            list.innerHTML = '';

            this.waypoints.forEach((wp, index) => {
                const li = document.createElement('li');
                li.textContent = `#${index + 1} (${wp.lat.toFixed(4)}, ${wp.lng.toFixed(4)})`;

                const upBtn = document.createElement('button');
                upBtn.textContent = '↑';
                upBtn.onclick = () => this.moveWaypoint(index, -1);

                const downBtn = document.createElement('button');
                downBtn.textContent = '↓';
                downBtn.onclick = () => this.moveWaypoint(index, 1);

                const removeBtn = document.createElement('button');
                removeBtn.textContent = 'Remove';
                removeBtn.onclick = () => this.removeWaypoint(wp.id);

                li.appendChild(upBtn);
                li.appendChild(downBtn);
                li.appendChild(removeBtn);

                list.appendChild(li);
            });
        }

        removeWaypoint(id) {
            const index = this.waypoints.findIndex(w => w.id === id);
            if (index === -1) return;

            this.waypoints.splice(index, 1);
            this.map.removeLayer(this.markers[index]);
            this.markers.splice(index, 1);

            this.updatePolyline();
            this.renderList();
            this.updateDistanceDisplay();

        }

        moveWaypoint(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= this.waypoints.length) return;

            [this.waypoints[index], this.waypoints[newIndex]] =
                [this.waypoints[newIndex], this.waypoints[index]];

            [this.markers[index], this.markers[newIndex]] =
                [this.markers[newIndex], this.markers[index]];

            this.updatePolyline();
            this.renderList();
        }

        calculateTotalDistance() {
  if (this.waypoints.length < 2) return 0;

  const ref = this.waypoints[0];
  let total = 0;

  for (let i = 1; i < this.waypoints.length; i++) {
    const prev = this.toCartesian(
      this.waypoints[i - 1].lat,
      this.waypoints[i - 1].lng,
      ref.lat,
      ref.lng
    );

    const curr = this.toCartesian(
      this.waypoints[i].lat,
      this.waypoints[i].lng,
      ref.lat,
      ref.lng
    );

    const dx = curr.x - prev.x;
    const dy = curr.y - prev.y;

    total += Math.sqrt(dx * dx + dy * dy);
  }

  return total;
}
updateDistanceDisplay() {
  const total = this.calculateTotalDistance();
  document.getElementById('total-distance').textContent =
    `Total Distance: ${total.toFixed(2)} m`;
}

    }

    const route = new RouteManager(map);

    map.on('click', e => {
        route.addWaypoint(e.latlng);
    });
</script>

    <div id="container">
        <div id="sidebar">
            <h3>Waypoints</h3>
            <ul id="waypoint-list"></ul>
            <div id="total-distance">
  Total Distance: 0 m
</div>

        </div>
    </div>
    <button onclick="route.exportCSV()">Export CSV</button>



</body>

</html>
